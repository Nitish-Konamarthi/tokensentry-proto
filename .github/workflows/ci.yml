name: CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'dashboard/**'
      - 'website/**'
      - 'shared-types/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'dashboard/**'
      - 'website/**'
      - 'shared-types/**'
      - '.github/workflows/**'

jobs:
  packages:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, dashboard, website, shared-types]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.package }}

      - run: npm run typecheck
        working-directory: ${{ matrix.package }}

      - run: npm run build
        working-directory: ${{ matrix.package }}

  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokensentry
          POSTGRES_PASSWORD: tokensentry
          POSTGRES_DB: tokensentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      - run: npm run typecheck
        working-directory: api

      - run: npm test
        working-directory: api
        env:
          DATABASE_URL: postgresql://tokensentry:tokensentry@localhost:5432/tokensentry
          VALKEY_URL: redis://localhost:6379
          API_KEY_PEPPER: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
