receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus scrape receiver for internal metrics
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes:
    actions:
      - key: deployment.environment
        value: production
        action: upsert
  filter/logs:
    error_mode: ignore
    logs:
      exclude:
        match_type: regexp
        resource_attributes:
          - key: service.name
            value: .*/health.*

exporters:
  # ── Debug (always on) ──
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 10

  # ── Prometheus (always on) ──
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: tokensentry
    send_timestamps: true
    metric_expiration: 180m
    resource_to_telemetry_conversion:
      enabled: true

  # ── OTLP (forward to backend — configure via env vars) ──
  otlp/backend:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT:-grpc://localhost:4317}
    tls:
      insecure: ${env:OTEL_INSECURE:-true}
      insecure_skip_verify: ${env:OTEL_INSECURE:-true}
    headers:
      Authorization: ${env:OTEL_EXPORTER_OTLP_HEADERS:-}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus, otlp/backend]
    metrics:
      receivers: [otlp, prometheus/internal]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus, otlp/backend]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes, filter/logs]
      exporters: [debug, otlp/backend]
