# ═══════════════════════════════════════════════════════════
# TOKENSENTRY — Docker Compose (single VPS)
# ═══════════════════════════════════════════════════════════

volumes:
  pgdata:
  valkey_data:
  certbot_www:
  certbot_conf:
  nginx_cache:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - ./nginx/ssl/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
    depends_on:
      - api
      - dashboard
      - website
    networks:
      internal:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v2.9
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet
        sleep 43200
      done
      "

  api:
    build:
      context: ../api
      target: runner
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: info
      TRUSTED_PROXY_CIDRS: 172.20.0.2/32,127.0.0.1/32
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: redis://valkey:6379
      API_KEY_PEPPER: ${TS_PEPPER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health/ready', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ../dashboard
      target: runner
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3001"
      TOKENSENTRY_API_URL: http://api:3000
      TOKENSENTRY_DASHBOARD_API_KEY: ${TOKENSENTRY_DASHBOARD_API_KEY}
      DASHBOARD_ALLOWED_EMAILS: ${DASHBOARD_ALLOWED_EMAILS}
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: https://app.tokensentry.ai
      AUTH0_ISSUER_BASE_URL: https://${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
    depends_on:
      - api
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  website:
    build:
      context: ../website
      target: runner
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${PG_USER:-tokensentry}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-tokensentry}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../api/sql/01-postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-tokensentry} -d ${PG_DATABASE:-tokensentry}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgbackup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGUSER: ${PG_USER:-tokensentry}
      PGPASSWORD: ${PG_PASSWORD}
      PGDATABASE: ${PG_DATABASE:-tokensentry}
      PGHOST: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      apk add --no-cache curl
      while :; do
        /usr/local/bin/backup.sh
        sleep 86400
      done
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-tokensentry} -d ${PG_DATABASE:-tokensentry}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
