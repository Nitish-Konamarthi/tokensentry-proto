user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    client_max_body_size 10m;
    large_client_header_buffers 4 16k;

    client_header_timeout 10s;
    client_body_timeout 60s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/html text/javascript image/svg+xml application/vnd.api+json;

    limit_req_zone $http_x_ts_org_id   zone=proxy:10m    rate=100r/s;
    limit_req_zone $http_x_ts_org_id   zone=api:10m      rate=300r/s;
    limit_req_zone $binary_remote_addr  zone=auth:5m      rate=10r/m;
    limit_req_zone $http_x_ts_org_id   zone=advisor:5m   rate=10r/m;
    limit_req_zone $binary_remote_addr  zone=global:10m   rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_conn_zone $http_x_ts_org_id   zone=conn_org:10m;

    proxy_cache_path /var/cache/nginx/analytics
        levels=1:2 keys_zone=analytics:10m max_size=2g inactive=5m use_temp_path=off;

    upstream api_pool {
        zone api_pool 64k;
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream dashboard_pool {
        zone dashboard_pool 64k;
        server dashboard:3001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(),microphone=(),camera=(),payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.auth0.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.tokensentry.ai https://api.stripe.com https://*.auth0.com wss://api.tokensentry.ai; frame-src https://js.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Server "TokenSentry" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    log_format json escape=json
      '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method",'
      '"u":"$uri","s":$status,"b":$body_bytes_sent,'
      '"rt":"$request_time","ut":"$upstream_response_time",'
      '"cs":"$upstream_cache_status","org":"$http_x_ts_org_id",'
      '"cid":"$upstream_http_x_ts_call_id","ua":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json buffer=32k flush=5s;
    resolver 127.0.0.11 valid=30s;
    include /etc/nginx/conf.d/*.conf;
}
