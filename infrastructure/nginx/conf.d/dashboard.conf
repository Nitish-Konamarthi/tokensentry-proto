server {
    listen 80;
    listen [::]:80;
    server_name app.tokensentry.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.tokensentry.ai;

    ssl_certificate /etc/letsencrypt/live/app.tokensentry.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tokensentry.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    access_log /var/log/nginx/dashboard.log json buffer=32k flush=5s;
    error_log  /var/log/nginx/dashboard.error.log warn;

    gzip_static on;
    gunzip on;

    location /_next/static/ {
        proxy_pass http://dashboard_pool;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    location /static/ {
        proxy_pass http://dashboard_pool;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    location / {
        proxy_pass http://dashboard_pool;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
        client_max_body_size 10m;
    }
}
