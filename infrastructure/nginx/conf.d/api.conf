server {
    listen 80;
    listen [::]:80;
    server_name api.tokensentry.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tokensentry.ai;

    ssl_certificate /etc/letsencrypt/live/api.tokensentry.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tokensentry.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    access_log /var/log/nginx/api.log json buffer=32k flush=5s;
    error_log  /var/log/nginx/api.error.log warn;

    limit_conn conn_ip 100;
    limit_conn conn_org 1000;

    location = /health/live {
        access_log off;
        proxy_pass http://api_pool;
    }
    location = /health/ready {
        access_log off;
        proxy_pass http://api_pool;
    }
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /v1/proxy {
        limit_req zone=proxy burst=200 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering "no";
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api_pool;
        proxy_next_upstream off;
    }

    location /v1/analytics/ {
        limit_req zone=api burst=50 nodelay;
        proxy_cache analytics;
        proxy_cache_valid 200 30s;
        proxy_cache_valid any 1s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_key "$host$uri$http_x_ts_org_id";
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://api_pool;
    }

    location /v1/advisor/ {
        limit_req zone=advisor burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_pool;
        proxy_read_timeout 60s;
    }

    location = /v1/stripe/webhook {
        allow 3.18.12.63/32;
        allow 3.130.192.231/32;
        allow 13.235.14.237/32;
        allow 13.235.122.149/32;
        allow 18.211.135.69/32;
        allow 35.154.171.200/32;
        allow 52.15.183.38/32;
        allow 54.187.174.169/32;
        allow 54.187.205.235/32;
        allow 54.187.216.72/32;
        allow 54.241.31.99/32;
        allow 54.241.31.102/32;
        allow 54.241.34.107/32;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api_pool;
    }

    location /v1/ {
        limit_req zone=api burst=150 nodelay;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
        proxy_pass http://api_pool;
    }

    location ~ /\. { deny all; return 404; }
    location ~* \.(php|asp|cgi|sh|py|pl|rb)$ { return 404; }
    location ~* (wp-admin|phpmyadmin|\.env|\.git|\.svn) { return 404; }

    error_page 429 = @ratelimit;
    error_page 502 503 = @upstream_error;

    location @ratelimit {
        default_type application/json;
        return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Rate limit exceeded","retry_after":60}';
    }
    location @upstream_error {
        default_type application/json;
        return 502 '{"error":"UPSTREAM_ERROR","message":"TokenSentry API temporarily unavailable"}';
    }
}
